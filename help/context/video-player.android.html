            var curTitles;
            var idx = 0;
            var showingIndex = -1;
            var spanElement;

            function updateCaption(vid) {
                while (idx < curTitles.length) {
                    if (vid.currentTime < curTitles[idx].start) {
                        return;
                    } else if (vid.currentTime >= curTitles[idx].end) {
                        removeCaption();
                        idx++;
                    } else {
                        updateForIndex(idx);
                        break;
                    }
                }
            }

            function removeCaption() {
                showingIndex = -1;
                spanElement.innerHTML = "&nbsp;";
            }

            function updateForIndex(index) {
                if (index == showingIndex) {
                    return;
                }
                showingIndex = index;
                var msg = curTitles[index].msg;
                if (!spanElement) {
                    spanElement = document.getElementById('vidcaption');
                }
                spanElement.innerHTML = msg;
            }

        <div id="container">
            <span id="vidcaption">&nbsp;</span>
            <video id="vid" autoplay muted playsinline></video>
        </div>
        <script>
            function ready(fn) {
                if (document.readyState !== 'loading') {
                    fn();
                    return;
                }
                document.addEventListener('DOMContentLoaded', fn);
            }
            ready(function() {
                let vid = document.getElementById("vid");
                vid.addEventListener('loadeddata', function() {
                    //vid.textTracks[0].mode = "showing";
                    window.setTimeout(function() {
                        if (vid.paused) {
                            //vid.setAttribute("controls", "controls");
                            vid.play();
                        }
                    }, 2000);
                });
                vid.addEventListener('timeupdate', function() { updateCaption(vid); });
                vid.addEventListener('ended', function () {
                    idx = 0;
                    this.play();
                })
                
                const queryString = window.location.search;
                let parts = window.location.search.split("=");
                let name = "";
                if (parts.length > 1) {
                    name = parts[1];
                }
    
                curTitles = titles[name];
                /*

                track.addEventListener("load", function() {

                });*/
    
                let source = document.createElement('source');
                source.setAttribute('src', './' + name + ".mp4");
                source.setAttribute('type', 'video/mp4');

            });
